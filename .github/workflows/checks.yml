name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# A newer push to the same branch or pull request replaces the running checks.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Node alone: the checks use only its built-in modules, and with no
      # install there is no yarn cache to save. setup-node caches yarn by itself when
      # package.json names a packageManager, so that is turned off too.
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Check proposed range with before-side permissions
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW: ${{ github.event_name == 'pull_request' && '--review' || '' }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then BEFORE=$(git rev-parse HEAD); fi
          export STUDIO_REPOSITORY_ROLE=$(gh api repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission --jq .role_name)
          node tooling/checks/run.ts scope --ci "$BEFORE" "$AFTER" $REVIEW
          node tooling/checks/run.ts assets --ci "$BEFORE" "$AFTER"

  bundle:
    name: Lint, types and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # corepack comes first: setup-node asks yarn where its cache lives.
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn check
      - run: yarn studio sync --check
      - run: yarn build
      - run: yarn build:inspect

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --immutable
      - run: yarn test

  # The browser scenarios run one file at a time and take most of the suite's
  # time, so their files are split across runners. Together with the job above,
  # the shards run every test `yarn test:full` runs.
  e2e:
    name: Browser tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # Every shard finishes, so one run reports all the failing scenarios.
      fail-fast: false
      # Vitest splits by file count, not duration. With six shards the slowest
      # one stays near ten minutes; fewer put the longest files together.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The required check. A failed, cancelled or skipped job fails it; the
  # browser tests succeed only when every shard did.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [bundle, tests, e2e, scope]
    if: always()
    steps:
      - run: |
          test "${{ needs.bundle.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.scope.result }}" = success
