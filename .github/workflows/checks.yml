name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# A newer push to the same branch or pull request replaces the running checks.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: Lint, types and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # corepack comes first: setup-node asks yarn where its cache lives.
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn build
      - run: yarn build:inspect

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:full

  # The required check. A failed, cancelled or skipped job fails it.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [bundle, tests]
    if: always()
    steps:
      - run: |
          test "${{ needs.bundle.result }}" = success
          test "${{ needs.tests.result }}" = success
