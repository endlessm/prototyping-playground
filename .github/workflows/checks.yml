name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` lets the browser-tests label start them without a new push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  workflow_call:

# A newer push to the same branch or pull request replaces the running checks.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Node alone: the checks use only its built-in modules, and with no
      # install there is no yarn cache to save. setup-node caches yarn by itself when
      # package.json names a packageManager, so that is turned off too.
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Check proposed range with before-side permissions
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW: ${{ github.event_name == 'pull_request' && '--review' || '' }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then BEFORE=$(git rev-parse HEAD); fi
          export STUDIO_REPOSITORY_ROLE=$(gh api repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission --jq .role_name)
          node tooling/checks/run.ts scope --ci "$BEFORE" "$AFTER" $REVIEW
          node tooling/checks/run.ts assets --ci "$BEFORE" "$AFTER"
      # A change made only of guidance (Markdown outside the content the build
      # validates, or files in a skills folder) can't break the build or the
      # tests, so it skips them; lint, format and the module checks still run.
      # Prototypes, systems and test fixtures are content, never guidance.
      - name: Tell whether the change touches code
        id: changes
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
            files=$(git diff --name-only "$BEFORE...$AFTER") && [ -n "$files" ] &&
            ! printf '%s\n' "$files" | grep -Ev '(^|/)skills/|\.md$' | grep -q . &&
            ! printf '%s\n' "$files" | grep -Eq '^(src/prototypes|src/systems|tests)/'
          then code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Touches code: $code"

  bundle:
    name: Lint, types and production build
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # corepack comes first: setup-node asks yarn where its cache lives.
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
        if: needs.scope.outputs.code == 'true'
      - run: yarn check
      - run: yarn studio sync --check
      - run: yarn build
        if: needs.scope.outputs.code == 'true'
      - run: yarn build:inspect
        if: needs.scope.outputs.code == 'true'

  tests:
    name: Unit and integration tests
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --immutable
      - run: yarn test

  # The browser scenarios cost about nine tenths of the run's minutes, so they
  # run only on demand: from "Run workflow", from a caller, or on a pull
  # request labelled `run-browser-tests` (add it once the change is ready; every
  # later push runs them again until it is removed). Otherwise they run locally
  # with `yarn test:e2e` before pushing. They run one file at a time, so their
  # files are split across runners; together with the job above, the shards run
  # every test `yarn test:full` runs.
  e2e:
    name: Browser tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: scope
    if: >-
      needs.scope.outputs.code == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      contains(github.event.pull_request.labels.*.name, 'run-browser-tests'))
    runs-on: ubuntu-latest
    strategy:
      # Every shard finishes, so one run reports all the failing scenarios.
      fail-fast: false
      # Vitest splits by file count, not duration. With six shards the slowest
      # one stays near ten minutes; fewer put the longest files together.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The required check. A failed, cancelled or skipped job fails it, except the
  # tests, which are skipped for guidance-only changes and, for the browser
  # tests, when not asked for; when they run, they succeed only when every
  # shard did.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [bundle, tests, e2e, scope]
    if: always()
    steps:
      - run: |
          test "${{ needs.bundle.result }}" = success
          case "${{ needs.tests.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.e2e.result }}" in success|skipped) ;; *) exit 1 ;; esac
          test "${{ needs.scope.result }}" = success
